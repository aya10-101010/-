<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#2563eb">
<title>English Grammar Trainer</title>
<link rel="manifest" href="manifest.json">
<style>
*{box-sizing:border-box}body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;background:#f4f7fb;color:#172033}
.app{max-width:720px;margin:auto;min-height:100vh;background:#fff}
header{position:sticky;top:0;background:#fff;border-bottom:1px solid #e5e7eb;padding:16px;z-index:2}
h1{font-size:20px;margin:0}.sub{font-size:12px;color:#64748b;margin-top:4px}
main{padding:16px 16px 90px}.card{background:#fff;border:1px solid #e5e7eb;border-radius:18px;padding:16px;margin-bottom:14px;box-shadow:0 2px 10px #00000008}
button{border:0;border-radius:12px;padding:12px 14px;font-size:15px;font-weight:600;cursor:pointer}
.primary{background:#2563eb;color:white;width:100%}.secondary{background:#eef2ff;color:#1d4ed8}.ghost{background:#f1f5f9;color:#334155}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}.stat{padding:14px;background:#f8fafc;border-radius:14px}.stat b{font-size:22px;display:block}.muted{color:#64748b;font-size:13px}
.progress{height:8px;background:#e5e7eb;border-radius:99px;overflow:hidden}.bar{height:100%;background:#2563eb}
.option{width:100%;text-align:left;margin:7px 0;background:#f8fafc;border:2px solid #e2e8f0;color:#172033}.option.selected{border-color:#2563eb;background:#eff6ff}.option.correct{border-color:#16a34a;background:#f0fdf4}.option.wrong{border-color:#dc2626;background:#fef2f2}
.feedback{padding:14px;border-radius:14px;background:#f8fafc;line-height:1.65}.tag{display:inline-block;font-size:12px;padding:4px 8px;border-radius:999px;background:#e0e7ff;color:#3730a3;margin:2px}
.nav{position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:min(720px,100%);background:#fff;border-top:1px solid #e5e7eb;display:grid;grid-template-columns:repeat(4,1fr);padding:8px 6px calc(8px + env(safe-area-inset-bottom));z-index:3}
.nav button{background:transparent;color:#64748b;padding:8px 4px;font-size:12px}.nav button.active{color:#2563eb}
input{width:100%;padding:14px;border:2px solid #cbd5e1;border-radius:12px;font-size:18px}
h2{font-size:18px}h3{font-size:15px}.row{display:flex;justify-content:space-between;gap:10px;align-items:center}.smallbtn{padding:8px 10px;font-size:12px}
.hidden{display:none!important}.danger{color:#dc2626}.success{color:#16a34a}
.barrow{margin:10px 0}.barlabel{display:flex;justify-content:space-between;font-size:13px;margin-bottom:4px}
</style>
</head>
<body>
<div class="app">
<header><h1>English Grammar Trainer</h1><div class="sub">TOEICを目指しながら、英語の基礎から文法力を伸ばす</div></header>
<main id="app"></main>
<nav class="nav">
<button onclick="showPage('home')" id="n-home">ホーム</button>
<button onclick="showPage('quiz')" id="n-quiz">学習</button>
<button onclick="showPage('review')" id="n-review">復習</button>
<button onclick="showPage('stats')" id="n-stats">分析</button>
</nav>
</div>
<script>
const BANK=[
{id:"p1",topic:"品詞",sub:"形容詞・副詞",d:1,q:"She speaks English ____.",opts:["fluent","fluently","fluency","more fluent"],a:1,exp:"speak は動詞なので、その動作を説明する語には副詞 fluently が必要です。形容詞 fluent は名詞を説明するのが基本です。",roles:"She=代名詞 / speaks=動詞 / English=名詞 / fluently=副詞",hint:"動詞 speaks を説明している語に注目。"},
{id:"p2",topic:"三単現",sub:"現在形",d:1,q:"My brother ____ to school by bus every day.",opts:["go","goes","going","gone"],a:1,exp:"主語 My brother は三人称単数なので、現在形では動詞に -s が必要です。",roles:"My brother=名詞句（主語） / goes=動詞 / to=前置詞 / school=名詞",hint:"主語が一人・一つかを確認。"},
{id:"p3",topic:"品詞",sub:"名詞・形容詞",d:1,q:"The new machine is very ____.",opts:["efficiency","efficient","efficiently","efficiencies"],a:1,exp:"be動詞 is の後ろで主語 machine の状態を説明する補語なので形容詞 efficient が適切です。",roles:"The new machine=名詞句 / is=be動詞 / very=副詞 / efficient=形容詞",hint:"be動詞の後ろで状態を説明する語。"},
{id:"p4",topic:"前置詞",sub:"時間",d:1,q:"The meeting starts ____ 9 a.m.",opts:["in","on","at","for"],a:2,exp:"具体的な時刻には at を使います。at 9 a.m. が正しい組み合わせです。",roles:"The meeting=名詞句 / starts=動詞 / at=前置詞 / 9 a.m.=時刻",hint:"時刻・日・月で使う前置詞を区別。"},
{id:"p5",topic:"現在進行形",sub:"be + -ing",d:1,q:"Look! The students ____ English now.",opts:["study","studied","are studying","have studied"],a:2,exp:"now があるので、今まさに行っている動作を表す現在進行形 are studying が適切です。",roles:"The students=名詞句 / are studying=動詞句 / now=副詞",hint:"now は時間の手がかり。"},
{id:"p6",topic:"過去形",sub:"規則動詞",d:1,q:"We ____ the report yesterday.",opts:["finish","finished","have finish","are finishing"],a:1,exp:"yesterday は過去を表すので、過去形 finished を使います。",roles:"We=代名詞 / finished=動詞 / the report=名詞句 / yesterday=副詞",hint:"yesterday がどの時制を要求するか考える。"},
{id:"p7",topic:"不定詞",sub:"to + 動詞",d:1,q:"I went to the library ____ study.",opts:["for","to","at","by"],a:1,exp:"目的を表す「～するために」は to + 動詞の原形を使います。to study です。",roles:"I=代名詞 / went=動詞 / to the library=前置詞句 / to study=不定詞",hint:"目的を表す形を考える。"},
{id:"p8",topic:"動名詞",sub:"動詞 + -ing",d:1,q:"She enjoys ____ books.",opts:["read","to read","reading","reads"],a:2,exp:"enjoy の後ろには動名詞（-ing形）を置きます。enjoy reading が正しい形です。",roles:"She=代名詞 / enjoys=動詞 / reading=動名詞 / books=名詞",hint:"enjoy の後ろに置ける形を思い出す。"},
{id:"p9",topic:"受動態",sub:"be + 過去分詞",d:1,q:"The car ____ by the company last year.",opts:["made","was made","makes","has make"],a:1,exp:"車が「作る」のではなく「作られる」ので受動態です。last year なので was made が適切です。",roles:"The car=名詞句 / was made=受動態 / by the company=行為者を表す句",hint:"主語が動作をする側か、される側か。"},
{id:"p10",topic:"現在完了",sub:"経験",d:1,q:"I ____ this movie three times.",opts:["see","saw","have seen","am seeing"],a:2,exp:"three times のように現在までの経験回数を表すとき、現在完了 have seen が使えます。",roles:"I=代名詞 / have seen=現在完了 / this movie=名詞句 / three times=副詞句",hint:"過去から現在につながる経験。"},
{id:"p11",topic:"品詞",sub:"副詞",d:2,q:"The manager carefully checked the document. Which word is an adverb?",opts:["manager","carefully","checked","document"],a:1,exp:"carefully は「どのように checked したか」を説明する副詞です。-ly で終わる副詞は多いですが、形だけでなく文中の役割で判断します。",roles:"manager=名詞 / carefully=副詞 / checked=動詞 / document=名詞",hint:"動作 checked の様子を説明する語。"},
{id:"p12",topic:"品詞",sub:"形容詞・副詞",d:2,q:"The technician worked ____ to finish the task.",opts:["careful","carefully","carefulness","care"],a:1,exp:"worked という動詞を説明するので副詞 carefully が必要です。careful は形容詞です。",roles:"technician=名詞 / worked=動詞 / carefully=副詞 / task=名詞",hint:"空欄は worked を説明している。"},
{id:"p13",topic:"比較",sub:"比較級",d:2,q:"This model is ____ than the previous one.",opts:["efficient","more efficient","most efficient","efficiency"],a:1,exp:"than がある比較では比較級を使います。efficient は長い形容詞なので more efficient が基本です。",roles:"This model=名詞句 / is=be動詞 / more efficient=形容詞の比較級 / than=比較を導く語",hint:"than の前後を比較。"},
{id:"p14",topic:"関係代名詞",sub:"who",d:2,q:"The engineer ____ designed this robot won an award.",opts:["which","who","where","when"],a:1,exp:"先行詞 engineer は人で、後ろの designed の主語になるため who が適切です。",roles:"The engineer=名詞句 / who=関係代名詞 / designed=動詞 / this robot=名詞句",hint:"先行詞は人・物・場所のどれか。"},
{id:"p15",topic:"助動詞",sub:"can",d:2,q:"Employees ____ use this room after 6 p.m.",opts:["can","are","have","did"],a:0,exp:"can は「～できる」「～してよい」など可能・許可を表す助動詞で、後ろには動詞の原形を置きます。",roles:"Employees=名詞 / can=助動詞 / use=動詞 / this room=名詞句",hint:"可能・許可を表す助動詞。"},
{id:"p16",topic:"主語と動詞の一致",sub:"there is/are",d:2,q:"There ____ several problems with the machine.",opts:["is","are","be","was"],a:1,exp:"several problems は複数なので、現在形の be動詞は are です。",roles:"There=形式的な語 / are=be動詞 / several problems=名詞句",hint:"several の後ろの名詞の数を見る。"},
{id:"p17",topic:"冠詞",sub:"a/an",d:2,q:"She bought ____ new laptop yesterday.",opts:["a","an","the","—"],a:0,exp:"初めて話題にする単数可算名詞 laptop の前なので a new laptop が適切です。new は /n/ の音で始まるため an ではありません。",roles:"She=代名詞 / bought=動詞 / a=冠詞 / new=形容詞 / laptop=名詞",hint:"単数可算名詞を初めて話題にするとき。"},
{id:"p18",topic:"可算・不可算",sub:"many/much",d:2,q:"We don't have ____ information about the problem.",opts:["many","much","a few","several"],a:1,exp:"information は通常不可算名詞なので、量を表す much を使います。",roles:"We=代名詞 / don't have=動詞句 / much=限定詞 / information=不可算名詞",hint:"information は数えられる名詞か考える。"},
{id:"p19",topic:"過去完了",sub:"had + 過去分詞",d:3,q:"When I arrived, the meeting ____ already started.",opts:["has","had","was","did"],a:1,exp:"過去のある時点（arrived）より前に開始していたので、過去完了 had started を使います。",roles:"When I arrived=副詞節 / the meeting=名詞句 / had started=過去完了 / already=副詞",hint:"過去の出来事よりさらに前の出来事。"},
{id:"p20",topic:"分詞",sub:"過去分詞",d:3,q:"The email ____ yesterday was sent to the wrong person.",opts:["send","sent","sending","sends"],a:1,exp:"email は「送った」のではなく「送られた」ので、過去分詞 sent を使って名詞 email を後ろから説明します。",roles:"The email=名詞句 / sent yesterday=分詞による修飾 / was sent=動詞句",hint:"email は動作をする側か、される側か。"},
{id:"p21",topic:"不定詞",sub:"目的",d:3,q:"The company hired more workers ____ production.",opts:["increase","increasing","to increase","increased"],a:2,exp:"「生産を増やすために」という目的なので to increase が適切です。to の後ろは動詞の原形です。",roles:"The company=名詞句 / hired=動詞 / more workers=目的語 / to increase production=目的を表す不定詞",hint:"hired の目的を考える。"},
{id:"p22",topic:"接続詞",sub:"because",d:3,q:"The flight was delayed ____ the weather was bad.",opts:["because","although","unless","while"],a:0,exp:"後ろに完全な文 the weather was bad があり、理由を表すので because が適切です。",roles:"The flight=名詞句 / was delayed=受動態 / because=接続詞 / the weather was bad=完全な節",hint:"後ろは主語＋動詞の完全な文で、意味は理由。"},
{id:"p23",topic:"前置詞",sub:"by/until",d:3,q:"Please submit the form ____ Friday.",opts:["by","at","on","from"],a:0,exp:"「金曜日までに」という締切を表す場合は by Friday です。on Friday は「金曜日に」という意味になります。",roles:"Please=副詞 / submit=動詞 / the form=名詞句 / by Friday=期限を表す前置詞句",hint:"締切を表す前置詞。"},
{id:"p24",topic:"関係代名詞",sub:"目的格",d:3,q:"The report ____ I read this morning was useful.",opts:["who","where","which","when"],a:2,exp:"先行詞 report は物で、I read の目的語になっているため which が適切です。",roles:"The report=先行詞 / which=関係代名詞 / I=主語 / read=動詞",hint:"先行詞は物。関係詞の後ろに主語 I がある。"},
{id:"p25",topic:"仮定法",sub:"would",d:3,q:"If I had more time, I ____ study English every day.",opts:["will","would","am","have"],a:1,exp:"現在の事実とは異なる仮定を表す If I had ... では、主節に would + 動詞原形を使います。",roles:"If I had more time=仮定を表す節 / I=主語 / would study=助動詞＋動詞",hint:"If節が過去形で、現在の仮定を表している。"},
{id:"p26",topic:"時制",sub:"未来",d:3,q:"By next month, we ____ the project.",opts:["finish","finished","will have finished","are finishing"],a:2,exp:"By next month は未来のある時点までの完了を示すので、未来完了 will have finished が適切です。",roles:"By next month=未来の基準時 / we=主語 / will have finished=未来完了",hint:"未来の時点までに完了することを表す。"},
{id:"p27",topic:"品詞",sub:"副詞",d:4,q:"The proposal was surprisingly effective. Which word modifies the adjective effective?",opts:["proposal","was","surprisingly","effective"],a:2,exp:"surprisingly は形容詞 effective の程度・様子を説明している副詞です。形容詞を修飾する副詞という関係を押さえます。",roles:"proposal=名詞 / was=be動詞 / surprisingly=副詞 / effective=形容詞",hint:"effective の意味を強めたり説明したりしている語。"},
{id:"p28",topic:"品詞",sub:"動詞・名詞",d:4,q:"The rapid ____ of technology has changed the industry.",opts:["develop","developing","development","developed"],a:2,exp:"The rapid の後ろで of technology と結びつく中心語が必要なので名詞 development が適切です。rapid は形容詞で名詞を修飾しています。",roles:"rapid=形容詞 / development=名詞 / of technology=前置詞句",hint:"The rapid の後ろに必要なのは何詞か。"},
{id:"p29",topic:"主語と動詞の一致",sub:"集合的表現",d:4,q:"The list of required documents ____ on the website.",opts:["are","were","is","have"],a:2,exp:"主語の中心は list で単数です。of required documents は修飾語なので、動詞は is になります。",roles:"The list of required documents=名詞句 / is=be動詞 / on the website=前置詞句",hint:"of documents に引っ張られず、名詞句の中心語を見る。"},
{id:"p30",topic:"語法",sub:"recommend",d:4,q:"The doctor recommended ____ more water.",opts:["drink","to drink","drinking","drank"],a:2,exp:"recommend の直後に動作を置く場合、recommend + 動名詞が使えます。recommend drinking が適切です。",roles:"The doctor=名詞句 / recommended=動詞 / drinking=動名詞 / more water=名詞句",hint:"recommend の後ろの動詞の形に注目。"}
];

const app=document.getElementById("app");
const KEY="egt_v1";
let S=JSON.parse(localStorage.getItem(KEY)||"null")||{
stats:{}, attempts:[], wrong:[], uncertain:[], answered:{}, current:null, profile:{name:"Learner"}
};
function save(){localStorage.setItem(KEY,JSON.stringify(S))}
function topicStats(t){return S.stats[t]||{correct:0,total:0,last:[]}}
function accuracy(t){let x=topicStats(t);return x.total?Math.round(x.correct/x.total*100):0}
function recent15(t){let x=topicStats(t);return x.last||[]}
function recentAcc(t){let a=recent15(t);return a.length?Math.round(a.reduce((s,v)=>s+v,0)/a.length*100):0}
function unlocked(t){let x=topicStats(t);return x.total>=15 && recent15(t).length>=15 && recentAcc(t)>=75}
function difficulty(t){
 let r=recentAcc(t), total=topicStats(t).total;
 if(total<5)return 1;
 if(r>=90 && total>=15)return 4;
 if(r>=80 && total>=10)return 3;
 if(r>=70 && total>=5)return 2;
 return 1;
}
function shuffle(a){return [...a].sort(()=>Math.random()-.5)}
function topics(){return [...new Set(BANK.map(x=>x.topic))]}
function chooseQuestions(){
 let selected=[], pool=shuffle(BANK);
 let weak=topics().sort((a,b)=>recentAcc(a)-recentAcc(b));
 // prioritize weak areas, then cover different topics
 for(const t of weak){
   if(selected.length>=10)break;
   let p=pool.filter(x=>x.topic===t && x.d<=difficulty(t)+1);
   if(p.length)selected.push(p[0]);
 }
 for(const q of pool) if(selected.length<10 && !selected.some(x=>x.id===q.id) && q.d<=Math.max(...topics().map(difficulty))+1) selected.push(q);
 return shuffle(selected.slice(0,10));
}
function showPage(p){
 document.querySelectorAll(".nav button").forEach(b=>b.classList.remove("active"));
 document.getElementById("n-"+p).classList.add("active");
 if(p==="home")renderHome(); if(p==="quiz")startSession(); if(p==="review")renderReview(); if(p==="stats")renderStats();
}
function renderHome(){
 let total=S.attempts.length, correct=S.attempts.filter(x=>x.correct).length;
 let wrong=S.wrong.length, uncertain=S.uncertain.length;
 document.getElementById("app").innerHTML=`<div class="card"><h2>今日の学習</h2><p class="muted">10問・文法を幅広く練習します。苦手分野は自動的に多めに出題されます。</p><button class="primary" onclick="startSession()">10問スタート</button></div>
 <div class="grid"><div class="stat"><span class="muted">総問題数</span><b>${total}</b></div><div class="stat"><span class="muted">総正答率</span><b>${total?Math.round(correct/total*100):0}%</b></div><div class="stat"><span class="muted">復習待ち</span><b>${wrong}</b></div><div class="stat"><span class="muted">曖昧回答</span><b>${uncertain}</b></div></div>
 <div class="card"><h2>苦手分野</h2>${renderWeak()}</div>
 <div class="card"><h2>学習方針</h2><p class="muted">4択で基礎を固め、各分野で「累計15問以上＋直近15問75%以上」を達成すると入力式へ移行します。正答率が上がるほど問題レベルも上がります。</p></div>`;
}
function renderWeak(){
 let arr=topics().map(t=>({t,a:recentAcc(t),n:topicStats(t).total})).filter(x=>x.n).sort((a,b)=>a.a-b.a).slice(0,5);
 if(!arr.length)return `<p class="muted">まだ学習データがありません。</p>`;
 return arr.map(x=>`<div class="barrow"><div class="barlabel"><span>${x.t}</span><span>${x.a}% / ${x.n}問</span></div><div class="progress"><div class="bar" style="width:${x.a}%"></div></div></div>`).join("");
}
function startSession(){
 S.current={qs:chooseQuestions(),i:0,answers:[],mode:"session"};save();renderQuestion();
}
function renderQuestion(){
 let c=S.current, q=c.qs[c.i]; if(!q){finishSession();return}
 let useInput=unlocked(q.topic);
 document.getElementById("app").innerHTML=`<div class="row"><div><b>第${c.i+1}問 / ${c.qs.length}</b><div class="muted">${q.topic}・${q.sub}・レベル${q.d}</div></div><span class="tag">${useInput?"入力式":"4択"}</span></div>
 <div class="progress" style="margin:12px 0 18px"><div class="bar" style="width:${c.i/c.qs.length*100}%"></div></div>
 <div class="card"><h2>${q.q}</h2>${useInput?`<input id="ans" autocomplete="off" placeholder="答えを入力"><button class="primary" style="margin-top:10px" onclick="submitInput()">回答する</button>`:q.opts.map((o,i)=>`<button class="option" onclick="submitChoice(${i})">${o}</button>`).join("")}
 <button class="ghost smallbtn" style="margin-top:10px" onclick="markUncertain()">🤔 曖昧だった</button>
 <button class="ghost smallbtn" style="margin-left:5px" onclick="toggleHint()">ヒント</button><div id="hint" class="muted hidden" style="margin-top:10px">${q.hint}</div></div>`;
}
function toggleHint(){document.getElementById("hint").classList.toggle("hidden")}
function markUncertain(){
 let q=S.current.qs[S.current.i];
 if(!S.uncertain.includes(q.id))S.uncertain.push(q.id);
 save(); alert("「曖昧だった」として記録しました。後で「復習」から確認できます。");
}
function submitChoice(i){answer(i===S.current.qs[S.current.i].a)}
function submitInput(){
 let q=S.current.qs[S.current.i], v=document.getElementById("ans").value.trim().toLowerCase();
 let accepted=q.opts[q.a].toLowerCase();
 // Basic normalization; exact target plus punctuation/space tolerance.
 answer(v===accepted);
}
function answer(ok){
 let q=S.current.qs[S.current.i], c=S.current;
 record(q,ok);
 c.answers.push({id:q.id,correct:ok});
 showFeedback(q,ok);
}
function record(q,ok){
 let st=topicStats(q.topic); st.total++; if(ok)st.correct++; st.last=(st.last||[]); st.last.push(ok?1:0); if(st.last.length>15)st.last.shift(); S.stats[q.topic]=st;
 S.attempts.push({id:q.id,topic:q.topic,correct:ok,time:Date.now()});
 if(!ok && !S.wrong.includes(q.id))S.wrong.push(q.id);
 save();
}
function showFeedback(q,ok){
 let idx=S.current.i, canNext=idx+1<S.current.qs.length;
 document.getElementById("app").innerHTML=`<div class="card"><div class="${ok?"success":"danger"}"><b>${ok?"正解！":"不正解"}</b></div><h2>${q.q}</h2><div class="feedback"><b>詳しい解説</b><p>${q.exp}</p><p><b>品詞・文の役割</b><br>${q.roles}</p><p><b>この問題の分野：</b>${q.topic} / ${q.sub}</p><p><b>直近15問の正答率：</b>${recentAcc(q.topic)}%${unlocked(q.topic)?" → 入力式対象":""}</p></div></div>
 <button class="primary" onclick="${canNext?"nextQuestion()":"finishSession()"}">${canNext?"次の問題":"結果を見る"}</button>`;
}
function nextQuestion(){S.current.i++;save();renderQuestion()}
function finishSession(){
 let c=S.current; let score=c.answers.filter(x=>x.correct).length;
 document.getElementById("app").innerHTML=`<div class="card"><h2>今回の結果</h2><div class="stat"><span class="muted">正答率</span><b>${score}/${c.qs.length} (${Math.round(score/c.qs.length*100)}%)</b></div><p>正解でも不正解でも解説を確認したことで、学習履歴に反映されています。</p></div>
 <div class="grid"><button class="secondary" onclick="startSession()">もう10問</button><button class="ghost" onclick="showPage('home')">ホームへ</button></div>`;
 S.current=null;save();
}
function renderReview(){
 let ids=[...new Set([...S.wrong,...S.uncertain])];
 let items=ids.map(id=>BANK.find(q=>q.id===id)).filter(Boolean);
 document.getElementById("app").innerHTML=`<div class="card"><h2>復習</h2><p class="muted">間違えた問題と「🤔曖昧だった」を付けた問題をまとめています。</p>${items.length?items.map(q=>`<div class="row" style="padding:12px 0;border-bottom:1px solid #e5e7eb"><div><b>${q.topic}</b>・${q.sub}<div class="muted">${q.q}</div></div><button class="secondary smallbtn" onclick="reviewOne('${q.id}')">解く</button></div>`).join(""):`<p>復習する問題はありません。</p>`}</div>
 <button class="ghost" onclick="clearReview()">復習リストを空にする</button>`;
}
function reviewOne(id){
 let q=BANK.find(x=>x.id===id); S.current={qs:[q],i:0,answers:[],mode:"review"};renderQuestion();
}
function clearReview(){S.wrong=[];S.uncertain=[];save();renderReview()}
function renderStats(){
 let rows=topics().map(t=>({t,n:topicStats(t).total,a:accuracy(t),r:recentAcc(t),u:unlocked(t),d:difficulty(t)})).sort((a,b)=>a.r-b.r);
 document.getElementById("app").innerHTML=`<div class="card"><h2>文法分析</h2><p class="muted">入力式への移行判定は各分野の「直近15問」で行います。</p>${rows.map(x=>`<div class="barrow"><div class="barlabel"><span><b>${x.t}</b> ${x.u?"・入力式":"・4択"}・Lv${x.d}</span><span>${x.r}%</span></div><div class="progress"><div class="bar" style="width:${x.r}%"></div></div><div class="muted">累計 ${x.n}問 / 全期間 ${x.a}% / 直近15問 ${x.r}%</div></div>`).join("")}</div>
 <div class="card"><h2>曖昧回答</h2><p>現在 ${S.uncertain.length}問</p><p class="muted">「曖昧だった」を押した問題は、正解していても復習対象として残ります。</p></div>
 <div class="card"><h2>アカウント</h2><p>学習者：${S.profile.name}</p><button class="ghost" onclick="resetData()">学習データを初期化</button></div>`;
}
function resetData(){if(confirm("すべての学習データを削除しますか？")){localStorage.removeItem(KEY);location.reload()}}
showPage("home");
</script>
</body>
</html>
