<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#111827">
<title>給料計算アプリ</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<main class="container">
  <header>
    <h1>給料計算</h1>
    <p>勤務日・勤務時間から、その日の給料を計算します。</p>
  </header>

  <section class="card">
    <h2>勤務日の計算</h2>
    <label>勤務日
      <input id="workDate" type="date" min="2026-01-01" max="2030-12-31">
    </label>
    <div id="dayInfo" class="day-info"></div>

    <div class="grid">
      <label>出勤
        <input id="startTime" type="time" value="17:00">
      </label>
      <label>退勤
        <input id="endTime" type="time" value="21:00">
      </label>
    </div>

    <button id="calcBtn" class="primary">給料を計算</button>
    <div id="result" class="result">勤務時間を入力して計算してください。</div>
  </section>

  <section class="card">
    <h2>給料設定</h2>
    <p class="muted">曜日・祝日・時間帯ごとに時給を設定できます。設定はこの端末のブラウザに保存されます。</p>
    <div id="wageSettings"></div>
    <button id="saveWages" class="primary">給料設定を保存</button>
    <button id="resetWages" class="secondary">初期設定に戻す</button>
  </section>

  <section class="card">
    <h2>計算履歴</h2>
    <div class="history-actions">
      <button id="todayBtn" class="secondary">今日の日付</button>
      <button id="clearHistory" class="danger">履歴を削除</button>
    </div>
    <div id="history"></div>
  </section>

  <footer>
    <small>対応期間：2026年〜2030年 / うるう年・日本の祝日・振替休日を判定</small>
  </footer>
</main>
<script src="script.js"></script>
</body>
</html>
